name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff mypy

      - name: Lint with ruff
        run: ruff check backend/ frontend/ --output-format=github

      - name: Type check with mypy
        run: mypy backend/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          API_KEY: test-key-for-ci
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t spending-predictor-backend:latest .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t spending-predictor-frontend:latest .

      - name: Verify backend health
        run: |
          docker run -d --name test-backend \
            -p 8000:8000 \
            -e API_KEY=test-key \
            spending-predictor-backend:latest
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop test-backend
